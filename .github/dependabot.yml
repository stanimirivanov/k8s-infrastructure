version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    reviewers:
      - stanimirivanov
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
