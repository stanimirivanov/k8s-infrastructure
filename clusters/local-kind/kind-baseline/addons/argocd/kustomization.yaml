apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  # Argo CD v3.5.2
  - https://raw.githubusercontent.com/argoproj/argo-cd/e258ee23c3e52266d407572f4bcdfe7d9ed36cb5/manifests/install.yaml
labels:
  - pairs:
      infra.k8s-infrastructure.io/owner: registered-kind-argocd
    includeSelectors: false
    includeTemplates: false
images:
  # Redis 8.2.3-alpine; identical multi-platform content on ECR Public and Docker Hub.
  - name: public.ecr.aws/docker/library/redis
    newName: docker.io/library/redis
    digest: sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
patches:
  - path: redis-pull-policy.yaml
